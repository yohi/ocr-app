name: OpenCodeReview Engine (App Worker Dispatch Handler)

on:
  repository_dispatch:
    types: [open_code_review_trigger]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  run-ocr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Parse target repo
        id: parse-target
        env:
          TARGET_REPO: ${{ github.event.client_payload.target_repo }}
        run: |
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TARGET_REPO##*/}" >> "$GITHUB_OUTPUT"
      - name: Checkout self repository (for scripts)
        uses: actions/checkout@v4
        with:
          path: self-repo

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.parse-target.outputs.owner }}
          repositories: ${{ steps.parse-target.outputs.repo }}
          permission-pull-requests: write
          permission-issues: write
          permission-contents: read
          permission-checks: write

      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.target_repo }}
          ref: ${{ github.event.client_payload.commit_sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          path: target-repo
      - name: Mark Check Run in_progress
        if: github.event.client_payload.check_run_id != null
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: ${{ github.event.client_payload.target_repo }}
          CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id }}
        run: |
          REPO="${TARGET_REPO}"
          CHECK_RUN_ID="${CHECK_RUN_ID}"
          echo "Marking check run ${CHECK_RUN_ID} in_progress for ${REPO}"
          curl -sS -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -d '{"status":"in_progress"}'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review@latest

      - name: Configure OCR
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL || secrets.OCR_LLM_URL }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL || secrets.OCR_LLM_MODEL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_EXTRA_HEADERS: ${{ vars.OCR_LLM_EXTRA_HEADERS || secrets.OCR_LLM_EXTRA_HEADERS }}
          OCR_LLM_AUTH_HEADER_NAME: ${{ vars.OCR_LLM_AUTH_HEADER_NAME || secrets.OCR_LLM_AUTH_HEADER_NAME }}
          OCR_LLM_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC || 'false' }}
        run: |
          ocr config set llm.url "${OCR_LLM_URL}"
          ocr config set llm.model "${OCR_LLM_MODEL}"
          ocr config set llm.auth_token "${OCR_LLM_AUTH_TOKEN}"
          ocr config set llm.use_anthropic "${OCR_LLM_USE_ANTHROPIC}"
          
          EXTRA_HEADERS=""
          if [ -n "${OCR_LLM_AUTH_HEADER_NAME}" ]; then
            EXTRA_HEADERS="${OCR_LLM_AUTH_HEADER_NAME}=Bearer ${OCR_LLM_AUTH_TOKEN}"
          fi

          if [ -n "${OCR_LLM_EXTRA_HEADERS}" ]; then
            if [ -n "${EXTRA_HEADERS}" ]; then
              EXTRA_HEADERS="${EXTRA_HEADERS},${OCR_LLM_EXTRA_HEADERS}"
            else
              EXTRA_HEADERS="${OCR_LLM_EXTRA_HEADERS}"
            fi
          fi

          if [ -n "${EXTRA_HEADERS}" ]; then
            ocr config set llm.extra_headers "${EXTRA_HEADERS}"
          fi
          # Note: Anthropic-specific parameter; disabled for non-Anthropic providers
          # ocr config set llm.extra_body '{"thinking": {"type": "disabled"}}'


      - name: Test OCR LLM connection
        continue-on-error: true
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL || secrets.OCR_LLM_URL }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL || secrets.OCR_LLM_MODEL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_EXTRA_HEADERS: ${{ vars.OCR_LLM_EXTRA_HEADERS || secrets.OCR_LLM_EXTRA_HEADERS }}
          OCR_LLM_AUTH_HEADER_NAME: ${{ vars.OCR_LLM_AUTH_HEADER_NAME || secrets.OCR_LLM_AUTH_HEADER_NAME }}
          OCR_LLM_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC || 'false' }}
        run: |
          echo "Testing LLM connection..."
          ocr llm test || echo "LLM test failed with exit code: ${PIPESTATUS[0]}"

      - name: Preview OCR targets
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.client_payload.base_ref }}
          COMMIT_SHA: ${{ github.event.client_payload.commit_sha }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL || secrets.OCR_LLM_URL }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL || secrets.OCR_LLM_MODEL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_EXTRA_HEADERS: ${{ vars.OCR_LLM_EXTRA_HEADERS || secrets.OCR_LLM_EXTRA_HEADERS }}
          OCR_LLM_AUTH_HEADER_NAME: ${{ vars.OCR_LLM_AUTH_HEADER_NAME || secrets.OCR_LLM_AUTH_HEADER_NAME }}
          OCR_LLM_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC || 'false' }}
        run: |
          ocr review \
            --repo target-repo \
            --from "origin/${BASE_REF}" \
            --to "${COMMIT_SHA}" \
            --preview \
            --audience agent

      - name: Run OCR review
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.client_payload.base_ref }}
          COMMIT_SHA: ${{ github.event.client_payload.commit_sha }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL || secrets.OCR_LLM_URL }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL || secrets.OCR_LLM_MODEL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_EXTRA_HEADERS: ${{ vars.OCR_LLM_EXTRA_HEADERS || secrets.OCR_LLM_EXTRA_HEADERS }}
          OCR_LLM_AUTH_HEADER_NAME: ${{ vars.OCR_LLM_AUTH_HEADER_NAME || secrets.OCR_LLM_AUTH_HEADER_NAME }}
          OCR_LLM_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC || 'false' }}
        run: |
          set -o pipefail
          ocr review \
            --repo target-repo \
            --from "origin/${BASE_REF}" \
            --to "${COMMIT_SHA}" \
            --background "PR #${PR_NUMBER}" \
            --format json \
            --audience agent \
            --max-tools 50 \
            --concurrency 1 \
            > /tmp/ocr-result.json 2> >(tee /tmp/ocr-stderr.log >&2)

      - name: Post review comments
        if: always()
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          node self-repo/.github/workflows/scripts/post-ocr-comments.mjs \
            --repo "${{ github.event.client_payload.target_repo }}" \
            --pr "${{ github.event.client_payload.pr_number }}" \
            --result "/tmp/ocr-result.json"

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-debug-logs
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
          if-no-files-found: ignore
      - name: Update Check Run completed
        if: always() && github.event.client_payload.check_run_id != null
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: ${{ github.event.client_payload.target_repo }}
          CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id }}
        run: |
          REPO="${TARGET_REPO}"
          CHECK_RUN_ID="${CHECK_RUN_ID}"
          CONCLUSION="${{ job.status == 'success' && 'success' || 'failure' }}"
          echo "Marking check run ${CHECK_RUN_ID} completed (${CONCLUSION}) for ${REPO}"
          curl -sS -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -d "{\"status\":\"completed\",\"conclusion\":\"$CONCLUSION\"}"
