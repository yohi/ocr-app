name: OpenCodeReview Engine (App Worker Dispatch Handler)

on:
  repository_dispatch:
    types: [open_code_review_trigger]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  run-ocr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Parse target repo
        id: parse-target
        env:
          TARGET_REPO: ${{ github.event.client_payload.target_repo }}
        run: |
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TARGET_REPO##*/}" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.parse-target.outputs.owner }}
          repositories: ${{ steps.parse-target.outputs.repo }}
          permission-pull-requests: write
          permission-issues: write
          permission-contents: read

      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.target_repo }}
          ref: ${{ github.event.client_payload.commit_sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Mark Check Run in_progress
        if: github.event.client_payload.check_run_id != null
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ github.event.client_payload.target_repo }}"
          CHECK_RUN_ID="${{ github.event.client_payload.check_run_id }}"
          curl -sS -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -d '{"status":"in_progress"}'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review@latest

      - name: Configure OCR
        run: |
          ocr config set llm.url "${{ secrets.OCR_LLM_URL }}"
          ocr config set llm.auth_token "${{ secrets.OCR_LLM_AUTH_TOKEN }}"
          ocr config set llm.model "${{ secrets.OCR_LLM_MODEL }}"
          ocr config set llm.use_anthropic "${{ vars.OCR_LLM_USE_ANTHROPIC || 'false' }}"
          ocr config set llm.extra_body '{"thinking": {"type": "disabled"}}'

      - name: Preview OCR targets
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.client_payload.base_ref }}
          COMMIT_SHA: ${{ github.event.client_payload.commit_sha }}
        run: |
          ocr review \
            --repo . \
            --from "origin/${BASE_REF}" \
            --to "${COMMIT_SHA}" \
            --preview \
            --audience agent

      - name: Run OCR review
        env:
          BASE_REF: ${{ github.event.client_payload.base_ref }}
          COMMIT_SHA: ${{ github.event.client_payload.commit_sha }}
        run: |
          ocr review \
            --repo . \
            --from "origin/${BASE_REF}" \
            --to "${COMMIT_SHA}" \
            --background "PR #${{ github.event.client_payload.pr_number }}" \
            --format json \
            --audience agent \
            > /tmp/ocr-result.json 2> /tmp/ocr-stderr.log

      - name: Checkout ocr-app scripts
        uses: actions/checkout@v4
        with:
          path: .ocr-app-tools

      - name: Post review comments
        if: always()
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          node .ocr-app-tools/.github/workflows/scripts/post-ocr-comments.mjs \
            --repo "${{ github.event.client_payload.target_repo }}" \
            --pr "${{ github.event.client_payload.pr_number }}" \
            --result "/tmp/ocr-result.json"

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-debug-logs
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
          if-no-files-found: ignore
      - name: Update Check Run completed
        if: always() && github.event.client_payload.check_run_id != null
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ github.event.client_payload.target_repo }}"
          CHECK_RUN_ID="${{ github.event.client_payload.check_run_id }}"
          CONCLUSION="${{ job.status == 'success' && 'success' || 'failure' }}"
          curl -sS -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -d "{\"status\":\"completed\",\"conclusion\":\"$CONCLUSION\"}"
