name: Deploy Cloudflare Worker (GitHub App Backend)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'cloudflare-worker'
          secrets: |
            GITHUB_APP_PRIVATE_KEY
            WEBHOOK_SECRET
          vars: |
            GITHUB_APP_ID
            TARGET_DISPATCH_REPO
            GITHUB_APP_SLUG
        env:
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GITHUB_APP_ID: ${{ vars.GH_APP_ID }}
          TARGET_DISPATCH_REPO: ${{ vars.GH_TARGET_DISPATCH_REPO || 'yohi/ocr-app' }}
          GITHUB_APP_SLUG: ${{ vars.GH_APP_SLUG || 'opencodereview-app' }}
