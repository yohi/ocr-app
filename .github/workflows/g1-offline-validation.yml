name: G1 Offline Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-offline-validation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  offline-validation:
    name: Fixed-commit offline validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EVALUATION_COMMIT: 6eea267dccc56c76021cf1d4739b47ccd1465940
      EXPECTED_TREE: 61fcff8936a748d184b1ef9f70bbd0ea5386d63f
      EVIDENCE_DIR: ${{ github.workspace }}/g1-evidence
      NODE_OUTPUT_DIR: ${{ github.workspace }}/g1-evidence/node-output
      WORKER_OUTPUT_DIR: ${{ github.workspace }}/g1-evidence/worker-output
      STATIC_OUTPUT_DIR: ${{ github.workspace }}/g1-evidence/static-output
      EVALUATION_DIR: ${{ github.workspace }}/g1-evaluation
      WORKFLOW_SOURCE_DIR: ${{ github.workspace }}/workflow-source
      CANDIDATE_WORKFLOW: ${{ github.workspace }}/workflow-source/.github/workflows/g1-offline-validation.yml
      NODE_IMAGE: node:20.19.5-bookworm
    steps:
      - name: Record workflow identity and initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          mkdir -m 0750 -p "$EVIDENCE_DIR" "$EVALUATION_DIR"
          {
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'evaluation_commit=%s\n' "$EVALUATION_COMMIT"
            printf 'expected_tree=%s\n' "$EXPECTED_TREE"
          } | tee "$EVIDENCE_DIR/identity.txt"

      - name: Prepare isolated container output directories
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o 10001 -g 10001 -m 0755 \
            "$NODE_OUTPUT_DIR" "$WORKER_OUTPUT_DIR" "$STATIC_OUTPUT_DIR"

      - name: Checkout fixed evaluation commit
        uses: actions/checkout@v4
        with:
          ref: 6eea267dccc56c76021cf1d4739b47ccd1465940
          path: g1-evaluation
          persist-credentials: false
          fetch-depth: 2

      - name: Checkout workflow source identity
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: workflow-source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify workflow source identity and candidate
        shell: bash
        run: |
          set -euo pipefail
          workflow_source_commit="$(git -C "$WORKFLOW_SOURCE_DIR" rev-parse HEAD)"
          test "$workflow_source_commit" = "$GITHUB_SHA"
          test -f "$CANDIDATE_WORKFLOW"
          candidate_sha256="$(sha256sum "$CANDIDATE_WORKFLOW" | cut -d ' ' -f 1)"
          {
            printf 'workflow_source_commit=%s\n' "$workflow_source_commit"
            printf 'candidate_workflow_path=%s\n' "$CANDIDATE_WORKFLOW"
            printf 'candidate_workflow_sha256=%s\n' "$candidate_sha256"
          } | tee "$EVIDENCE_DIR/workflow-source-identity.txt"

      - name: Verify evaluation identity and source baseline
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git -C "$EVALUATION_DIR" rev-parse HEAD)"
          actual_tree="$(git -C "$EVALUATION_DIR" rev-parse 'HEAD^{tree}')"
          printf 'actual_evaluation_commit=%s\nactual_evaluation_tree=%s\n' \
            "$actual_commit" "$actual_tree" | tee "$EVIDENCE_DIR/evaluation-identity.txt"
          test "$actual_commit" = "$EVALUATION_COMMIT"
          test "$actual_tree" = "$EXPECTED_TREE"
          git -C "$EVALUATION_DIR" status --porcelain=v1 | tee "$EVIDENCE_DIR/evaluation-status.txt"
          test -z "$(git -C "$EVALUATION_DIR" status --porcelain=v1)"
          chmod 0755 "$EVALUATION_DIR"

      - name: Prepare pinned Node image and locked dependencies (network enabled)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$NODE_IMAGE" | tee "$EVIDENCE_DIR/docker-pull.log"
          docker image inspect "$NODE_IMAGE" \
            --format 'image={{index .RepoDigests 0}} image_id={{.Id}}' \
            | tee "$EVIDENCE_DIR/docker-image-identity.txt"
          test -s "$EVIDENCE_DIR/docker-image-identity.txt"
          docker run --rm --network bridge \
            --memory 2g --cpus 2 --pids-limit 256 --user 0:0 \
            --mount "type=bind,src=$EVALUATION_DIR,dst=/evaluation" \
            "$NODE_IMAGE" bash -euc '
              node --version
              npm --version
              npm ci --ignore-scripts --prefix /evaluation/.github/workflows
              npm ci --ignore-scripts --prefix /evaluation/cloudflare-worker
            ' 2>&1 | tee "$EVIDENCE_DIR/dependency-preparation.log"
          printf 'dependency_install_mode=npm ci --ignore-scripts with committed package-lock.json files\n' \
            | tee "$EVIDENCE_DIR/dependency-policy.txt"
          docker run --rm --network bridge --entrypoint sh "$NODE_IMAGE" -c \
            'node --version; npm --version' | tee "$EVIDENCE_DIR/node-tool-versions.txt"

      - name: Prepare versioned actionlint binary (network enabled)
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.7
          ACTIONLINT_ARCHIVE="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$ACTIONLINT_ARCHIVE"
          curl --proto '=https' --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            --output "$RUNNER_TEMP/actionlint_checksums.txt"
          checksum_line="$(awk -v f="$(basename "$ACTIONLINT_ARCHIVE")" '$2 == f {print}' "$RUNNER_TEMP/actionlint_checksums.txt")"
          test -n "$checksum_line"
          test "$(printf '%s\n' "$checksum_line" | wc -l)" -eq 1
          (cd "$RUNNER_TEMP" && printf '%s\n' "$checksum_line" | sha256sum --check --status)
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          "$RUNNER_TEMP/actionlint-bin/actionlint" -version \
            | tee "$EVIDENCE_DIR/actionlint-version.txt"

      - name: Run Node tests offline in restricted container
        shell: bash
        run: |
          set -euo pipefail
          node_step_budget_seconds=600
          SECONDS=0

          scoped_file=.github/workflows/scripts/authorize-decision-egress.test.mjs
          preload_file="$EVIDENCE_DIR/node-test-keepalive-preload.mjs"
          preload_sha_file="$EVIDENCE_DIR/node-test-keepalive-preload.sha256"
          preload_result=0

          if ! tee "$preload_file" >/dev/null <<'PRELOAD'
          import { afterEach, beforeEach } from 'node:test';

          const targetFileSuffix = '/authorize-decision-egress.test.mjs';
          const targetTestName = 'denies a hanging GitHub lookup after the request timeout';
          const isTargetFile = process.argv[1]?.endsWith(targetFileSuffix) === true;
          const timersByTestContext = new WeakMap();

          if (isTargetFile) {
            beforeEach((testContext) => {
              if (testContext.name !== targetTestName) return;
              timersByTestContext.set(testContext, setTimeout(() => {}, 12_000));
            });

            afterEach((testContext) => {
              const timer = timersByTestContext.get(testContext);
              if (timer === undefined) return;
              clearTimeout(timer);
              timersByTestContext.delete(testContext);
            });
          }
          PRELOAD
          then
            preload_result=1
          fi
          if [ "$preload_result" -eq 0 ] && ! chmod 0644 "$preload_file"; then
            preload_result=1
          fi
          preload_sha256=unavailable
          if [ "$preload_result" -eq 0 ]; then
            if preload_sha256="$(sha256sum "$preload_file" | cut -d ' ' -f 1)"; then
              if ! printf '%s  %s\n' "$preload_sha256" "$(basename "$preload_file")" \
                > "$preload_sha_file"; then
                preload_result=1
              fi
            else
              preload_result=1
            fi
          fi
          printf '%s\n' "$preload_result" > "$EVIDENCE_DIR/node-test-preload.exit-code"

          cd "$EVALUATION_DIR"
          shopt -s nullglob
          test_files=(.github/workflows/scripts/*.test.mjs)
          normal_files=()
          scoped_files=()
          for test_file in "${test_files[@]}"; do
            if [[ "$test_file" == "$scoped_file" ]]; then
              scoped_files+=("$test_file")
            else
              normal_files+=("$test_file")
            fi
          done

          partition_result=0
          if [ "${#test_files[@]}" -ne 39 ] || \
             [ "${#normal_files[@]}" -ne 38 ] || \
             [ "${#scoped_files[@]}" -ne 1 ] || \
             [ "${scoped_files[0]:-}" != "$scoped_file" ]; then
            partition_result=1
          fi
          declare -A partition_seen=()
          for test_file in "${normal_files[@]}" "${scoped_files[@]}"; do
            if [[ -n "${partition_seen["$test_file"]+present}" ]]; then
              partition_result=1
            else
              partition_seen["$test_file"]=1
            fi
          done
          for test_file in "${test_files[@]}"; do
            if [[ -z "${partition_seen["$test_file"]+present}" ]]; then
              partition_result=1
            fi
          done

          write_file_list() {
            local destination="$1"
            shift
            if [ "$#" -eq 0 ]; then
              sudo tee "$destination" </dev/null >/dev/null
            else
              printf '%s\n' "$@" | sudo tee "$destination" >/dev/null
            fi
          }
          manifest_result=0
          if ! write_file_list "$NODE_OUTPUT_DIR/node-test-files.txt" "${test_files[@]}"; then
            manifest_result=1
          fi
          if ! write_file_list "$NODE_OUTPUT_DIR/node-test-files-normal.txt" "${normal_files[@]}"; then
            manifest_result=1
          fi
          if ! write_file_list "$NODE_OUTPUT_DIR/node-test-files-scoped.txt" "${scoped_files[@]}"; then
            manifest_result=1
          fi
          printf '%s\n' "$partition_result" > "$EVIDENCE_DIR/node-test-partition.exit-code"
          printf '%s\n' "$manifest_result" > "$EVIDENCE_DIR/node-test-manifests.exit-code"

          scoped_result=125
          normal_result=125
          scoped_log_result=0
          scoped_combined_log_result=0
          normal_log_result=0
          normal_combined_log_result=0
          set +e
          remaining_seconds=$((node_step_budget_seconds - SECONDS))
          if [ "$partition_result" -eq 0 ] && [ "$manifest_result" -eq 0 ] && \
             [ "$preload_result" -eq 0 ] && [ "$remaining_seconds" -gt 0 ]; then
            timeout --signal=TERM --kill-after=10s "${remaining_seconds}s" docker run --pull=never --rm \
              --network none --read-only --memory 2g --cpus 2 --pids-limit 256 \
              --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001 \
              --mount "type=bind,src=$EVALUATION_DIR,dst=/evaluation,readonly" \
              --mount "type=bind,src=$preload_file,dst=/probe/keepalive-preload.mjs,readonly" \
              --workdir /evaluation \
              --env GIT_CONFIG_COUNT=1 \
              --env GIT_CONFIG_KEY_0=safe.directory \
              --env GIT_CONFIG_VALUE_0=/evaluation \
              --env NODE_OPTIONS=--import=/probe/keepalive-preload.mjs \
              --entrypoint node "$NODE_IMAGE" --test "${scoped_files[@]}" \
              2>&1 | tee "$EVIDENCE_DIR/node-tests-scoped.log" | tee -a "$EVIDENCE_DIR/node-tests.log"
            scoped_pipeline_status=("${PIPESTATUS[@]}")
            scoped_result="${scoped_pipeline_status[0]:-125}"
            scoped_log_result="${scoped_pipeline_status[1]:-125}"
            scoped_combined_log_result="${scoped_pipeline_status[2]:-125}"
          else
            if [ "$partition_result" -ne 0 ] || [ "$manifest_result" -ne 0 ]; then
              scoped_skip_reason='Scoped Group not run: partition or manifest validation failed.'
              scoped_result=125
            elif [ "$preload_result" -ne 0 ]; then
              scoped_skip_reason='Scoped Group not run: preload generation or identity failed.'
              scoped_result=125
            else
              scoped_skip_reason='Scoped Group not run: shared 10-minute Node test budget exhausted.'
              scoped_result=124
            fi
            printf '%s\n' "$scoped_skip_reason" \
              | tee "$EVIDENCE_DIR/node-tests-scoped.log" | tee -a "$EVIDENCE_DIR/node-tests.log"
            scoped_pipeline_status=("${PIPESTATUS[@]}")
            scoped_log_result="${scoped_pipeline_status[1]:-125}"
            scoped_combined_log_result="${scoped_pipeline_status[2]:-125}"
          fi

          remaining_seconds=$((node_step_budget_seconds - SECONDS))
          if [ "$partition_result" -eq 0 ] && [ "$manifest_result" -eq 0 ] && \
             [ "$remaining_seconds" -gt 0 ]; then
            timeout --signal=TERM --kill-after=10s "${remaining_seconds}s" docker run --pull=never --rm \
              --network none --read-only --memory 2g --cpus 2 --pids-limit 256 \
              --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001 \
              --tmpfs /node-test-tmp:rw,exec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
              --mount "type=bind,src=$EVALUATION_DIR,dst=/evaluation,readonly" \
              --workdir /evaluation \
              --env GIT_CONFIG_COUNT=1 \
              --env GIT_CONFIG_KEY_0=safe.directory \
              --env GIT_CONFIG_VALUE_0=/evaluation \
              --env TMPDIR=/node-test-tmp \
              --entrypoint node "$NODE_IMAGE" --test "${normal_files[@]}" \
              2>&1 | tee "$EVIDENCE_DIR/node-tests-normal.log" | tee -a "$EVIDENCE_DIR/node-tests.log"
            normal_pipeline_status=("${PIPESTATUS[@]}")
            normal_result="${normal_pipeline_status[0]:-125}"
            normal_log_result="${normal_pipeline_status[1]:-125}"
            normal_combined_log_result="${normal_pipeline_status[2]:-125}"
          else
            if [ "$partition_result" -ne 0 ] || [ "$manifest_result" -ne 0 ]; then
              normal_skip_reason='Normal Group not run: partition or manifest validation failed.'
              normal_result=125
            else
              normal_skip_reason='Normal Group not run: shared 10-minute Node test budget exhausted.'
              normal_result=124
            fi
            printf '%s\n' "$normal_skip_reason" \
              | tee "$EVIDENCE_DIR/node-tests-normal.log" | tee -a "$EVIDENCE_DIR/node-tests.log"
            normal_pipeline_status=("${PIPESTATUS[@]}")
            normal_log_result="${normal_pipeline_status[1]:-125}"
            normal_combined_log_result="${normal_pipeline_status[2]:-125}"
          fi
          set -e

          tap_summary_value() {
            local key="$1"
            local log_file="$2"
            awk -v key="$key" \
              '$1 == "#" && $2 == key && $3 ~ /^[0-9]+$/ { value = $3 } END { if (value == "") exit 1; print value }' \
              "$log_file"
          }
          summary_result=0
          counts_file="$EVIDENCE_DIR/node-tests-counts.txt"
          normal_skipped_count=unavailable
          scoped_skipped_count=unavailable
          : > "$counts_file"
          capture_tap_summary() {
            local group="$1"
            local log_file="$2"
            local key
            local value
            for key in tests pass fail cancelled skipped todo; do
              if [ -r "$log_file" ] && value="$(tap_summary_value "$key" "$log_file")"; then
                printf '%s_%s=%s\n' "$group" "$key" "$value" >> "$counts_file"
                if [ "$key" = skipped ]; then
                  if [ "$group" = normal ]; then
                    normal_skipped_count="$value"
                  else
                    scoped_skipped_count="$value"
                  fi
                fi
              else
                printf '%s_%s=unavailable\n' "$group" "$key" >> "$counts_file"
                summary_result=1
              fi
            done
          }
          capture_tap_summary normal "$EVIDENCE_DIR/node-tests-normal.log"
          capture_tap_summary scoped "$EVIDENCE_DIR/node-tests-scoped.log"
          printf 'historical_total_test_count_reference=667 (not a hard-coded pass gate)\n' \
            >> "$counts_file"

          result=0
          if [ "$partition_result" -ne 0 ] || [ "$manifest_result" -ne 0 ] || \
             [ "$preload_result" -ne 0 ] || [ "$summary_result" -ne 0 ] || \
             [ "$scoped_result" -ne 0 ] || [ "$normal_result" -ne 0 ] || \
             [ "$scoped_log_result" -ne 0 ] || [ "$scoped_combined_log_result" -ne 0 ] || \
             [ "$normal_log_result" -ne 0 ] || [ "$normal_combined_log_result" -ne 0 ] || \
             [ "$normal_skipped_count" != 0 ] || [ "$scoped_skipped_count" != 0 ]; then
            result=1
          fi
          printf '%s\n' "$scoped_result" > "$EVIDENCE_DIR/node-tests-scoped.exit-code"
          printf '%s\n' "$normal_result" > "$EVIDENCE_DIR/node-tests-normal.exit-code"
          printf '%s\n' "$scoped_log_result" > "$EVIDENCE_DIR/node-tests-scoped-log.exit-code"
          printf '%s\n' "$normal_log_result" > "$EVIDENCE_DIR/node-tests-normal-log.exit-code"
          printf '%s\n' "$scoped_combined_log_result" > "$EVIDENCE_DIR/node-tests-combined-log-scoped.exit-code"
          printf '%s\n' "$normal_combined_log_result" > "$EVIDENCE_DIR/node-tests-combined-log-normal.exit-code"
          printf '%s\n' "$result" > "$EVIDENCE_DIR/node-tests.exit-code"
          set -e
          sudo chown -R "$(id -u):$(id -g)" "$NODE_OUTPUT_DIR"
          sudo chmod -R u+rwX,go+rX "$NODE_OUTPUT_DIR"
          test -r "$NODE_OUTPUT_DIR/node-test-files.txt"
          test -r "$NODE_OUTPUT_DIR/node-test-files-normal.txt"
          test -r "$NODE_OUTPUT_DIR/node-test-files-scoped.txt"
          test -r "$EVIDENCE_DIR/node-tests-scoped.exit-code"
          test -r "$EVIDENCE_DIR/node-tests-normal.exit-code"
          test -r "$EVIDENCE_DIR/node-tests-counts.txt"
          test "$result" -eq 0

      - name: Run Worker tests offline in restricted container
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 10m docker run --rm \
            --network none --read-only --memory 2g --cpus 2 --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001 \
            --mount "type=bind,src=$EVALUATION_DIR,dst=/evaluation,readonly" \
            --mount "type=bind,src=$WORKER_OUTPUT_DIR,dst=/output" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/evaluation \
            --workdir /evaluation/cloudflare-worker \
            "$NODE_IMAGE" bash -euc 'npm test; printf "worker-test-command-completed\n" > /output/worker-test-execution.txt' \
            2>&1 | tee "$EVIDENCE_DIR/worker-tests.log"
          result=${PIPESTATUS[0]}
          set -e
          sudo chown -R "$(id -u):$(id -g)" "$WORKER_OUTPUT_DIR"
          sudo chmod -R u+rwX,go+rX "$WORKER_OUTPUT_DIR"
          if [ "$result" -eq 0 ]; then
            test -r "$WORKER_OUTPUT_DIR/worker-test-execution.txt"
          fi
          printf '%s\n' "$result" > "$EVIDENCE_DIR/worker-tests.exit-code"
          test "$result" -eq 0

      - name: Run actionlint and fixed-commit whitespace checks offline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 5m docker run --rm \
            --network none --read-only --memory 1g --cpus 1 --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001 \
            --mount "type=bind,src=$EVALUATION_DIR,dst=/evaluation,readonly" \
            --mount "type=bind,src=$STATIC_OUTPUT_DIR,dst=/output" \
            --mount "type=bind,src=$RUNNER_TEMP/actionlint-bin/actionlint,dst=/usr/local/bin/actionlint,readonly" \
            --mount "type=bind,src=$CANDIDATE_WORKFLOW,dst=/candidate/g1-offline-validation.yml,readonly" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/evaluation \
            --env EVALUATION_COMMIT="$EVALUATION_COMMIT" \
            --env EXPECTED_TREE="$EXPECTED_TREE" \
            --env EXPECTED_FIRST_PARENT=2001131ef22fde061d944358705f72d0f9415274 \
            --workdir /evaluation \
            "$NODE_IMAGE" bash -euc '
              set -uo pipefail
              set +e
              evidence_result=0
              overall_result=0

              git --version | tee /output/git-version.txt
              git_version_pipeline=("${PIPESTATUS[@]}")
              git_version_result="${git_version_pipeline[0]:-125}"
              git_version_tee_result="${git_version_pipeline[1]:-125}"
              if [ "$git_version_result" -ne 0 ] || [ "$git_version_tee_result" -ne 0 ]; then
                evidence_result=1
              fi

              actionlint -version | tee /output/actionlint-version.txt
              actionlint_version_pipeline=("${PIPESTATUS[@]}")
              actionlint_version_result="${actionlint_version_pipeline[0]:-125}"
              actionlint_version_tee_result="${actionlint_version_pipeline[1]:-125}"
              if [ "$actionlint_version_result" -ne 0 ] || [ "$actionlint_version_tee_result" -ne 0 ]; then
                evidence_result=1
              fi

              actionlint -color=false .github/workflows/*.yml /candidate/g1-offline-validation.yml
              actionlint_result=$?

              actual_commit="$(git rev-parse HEAD 2>&1)"
              actual_commit_result=$?
              actual_tree="$(git rev-parse "HEAD^{tree}" 2>&1)"
              actual_tree_result=$?
              actual_first_parent="$(git rev-parse --verify "HEAD^1" 2>&1)"
              actual_first_parent_result=$?
              expected_first_parent_object_result=0
              git cat-file -e "${EXPECTED_FIRST_PARENT}^{commit}" 2>/dev/null
              expected_first_parent_object_result=$?
              actual_first_parent_object_result=0
              if [ "$actual_first_parent_result" -eq 0 ]; then
                git cat-file -e "${actual_first_parent}^{commit}" 2>/dev/null
                actual_first_parent_object_result=$?
              fi
              parent_identity_result=0
              if [ "$actual_commit_result" -ne 0 ] || [ "$actual_tree_result" -ne 0 ] || \
                 [ "$actual_first_parent_result" -ne 0 ] || \
                 [ "$expected_first_parent_object_result" -ne 0 ] || \
                 [ "$actual_first_parent_object_result" -ne 0 ] || \
                 [ "$actual_commit" != "$EVALUATION_COMMIT" ] || \
                 [ "$actual_tree" != "$EXPECTED_TREE" ] || \
                 [ "$actual_first_parent" != "$EXPECTED_FIRST_PARENT" ]; then
                parent_identity_result=1
              fi
              {
                printf "evaluation_commit=%s\n" "$actual_commit"
                printf "expected_evaluation_commit=%s\n" "$EVALUATION_COMMIT"
                printf "evaluation_tree=%s\n" "$actual_tree"
                printf "expected_evaluation_tree=%s\n" "$EXPECTED_TREE"
                printf "actual_first_parent=%s\n" "$actual_first_parent"
                printf "expected_first_parent=%s\n" "$EXPECTED_FIRST_PARENT"
                printf "expected_first_parent_object_result=%s\n" "$expected_first_parent_object_result"
                printf "actual_first_parent_object_result=%s\n" "$actual_first_parent_object_result"
                printf "parent_identity_result=%s\n" "$parent_identity_result"
              } | tee /output/fixed-commit-parent-identity.txt
              parent_identity_pipeline=("${PIPESTATUS[@]}")
              if [ "${parent_identity_pipeline[1]:-125}" -ne 0 ]; then
                evidence_result=1
              fi

              fixed_delta_result=125
              fixed_delta_log_result=0
              if [ "$parent_identity_result" -eq 0 ]; then
                git diff --check "HEAD^1" HEAD 2>&1 | tee /output/fixed-commit-delta-whitespace.log
                fixed_delta_pipeline=("${PIPESTATUS[@]}")
                fixed_delta_result="${fixed_delta_pipeline[0]:-125}"
                fixed_delta_log_result="${fixed_delta_pipeline[1]:-125}"
              else
                printf "%s\n" "First-parent delta check not run: fixed Evaluation Commit, Tree, or First Parent identity/object verification failed." \
                  | tee /output/fixed-commit-delta-whitespace.log
                fixed_delta_pipeline=("${PIPESTATUS[@]}")
                fixed_delta_log_result="${fixed_delta_pipeline[1]:-125}"
              fi
              if ! printf "%s\n" "$fixed_delta_result" > /output/fixed-commit-delta-whitespace.exit-code; then
                evidence_result=1
              fi
              if [ "$parent_identity_result" -ne 0 ] || [ "$fixed_delta_result" -ne 0 ] || \
                 [ "$fixed_delta_log_result" -ne 0 ]; then
                overall_result=1
              fi

              candidate_diff_status=125
              candidate_result=1
              if [ -s /candidate/g1-offline-validation.yml ]; then
                candidate_diff_output="$(git diff --no-index --check -- /dev/null /candidate/g1-offline-validation.yml 2>&1)"
                candidate_diff_status=$?
                if [ -z "$candidate_diff_output" ] && \
                   { [ "$candidate_diff_status" -eq 0 ] || [ "$candidate_diff_status" -eq 1 ]; }; then
                  candidate_result=0
                fi
              else
                candidate_diff_output="Candidate Workflow is missing or empty."
              fi
              {
                printf "candidate_workflow_diff_check_exit_code=%s\n" "$candidate_diff_status"
                printf "candidate_workflow_diff_check_result=%s\n" "$candidate_result"
                if [ "$candidate_result" -eq 0 ]; then
                  printf "candidate_workflow_diff_check=clean\n"
                else
                  printf "candidate_workflow_diff_check=failed\n"
                  printf "%s\n" "$candidate_diff_output"
                fi
              } | tee /output/candidate-workflow-diff-check.txt
              candidate_pipeline=("${PIPESTATUS[@]}")
              if [ "${candidate_pipeline[1]:-125}" -ne 0 ]; then
                evidence_result=1
              fi
              if [ "$candidate_result" -ne 0 ]; then
                overall_result=1
              fi
              if ! printf "%s\n" "$candidate_diff_status" > /output/candidate-workflow-diff-check.exit-code; then
                evidence_result=1
              fi

              git diff --check > /output/clean-checkout-diff.log 2>&1
              clean_checkout_result=$?
              if ! printf "%s\n" "$clean_checkout_result" > /output/clean-checkout-diff.exit-code; then
                evidence_result=1
              fi
              if [ "$clean_checkout_result" -ne 0 ]; then
                overall_result=1
              fi
              printf "BASELINE_NOT_BOUND\n" | tee /output/baseline-diff-status.txt
              baseline_pipeline=("${PIPESTATUS[@]}")
              if [ "${baseline_pipeline[1]:-125}" -ne 0 ]; then
                evidence_result=1
              fi

              if [ "$git_version_result" -ne 0 ] || [ "$git_version_tee_result" -ne 0 ] || \
                 [ "$actionlint_version_result" -ne 0 ] || [ "$actionlint_version_tee_result" -ne 0 ] || \
                 [ "$actionlint_result" -ne 0 ] || [ "$evidence_result" -ne 0 ]; then
                overall_result=1
              fi
              exit "$overall_result"
            ' 2>&1 | tee "$EVIDENCE_DIR/static-checks.log"
          static_pipeline_status=("${PIPESTATUS[@]}")
          container_result="${static_pipeline_status[0]:-125}"
          static_log_result="${static_pipeline_status[1]:-125}"
          result="$container_result"
          if [ "$static_log_result" -ne 0 ]; then
            result=1
          fi
          if ! printf '%s\n' "$container_result" > "$EVIDENCE_DIR/static-checks-container.exit-code"; then
            result=1
          fi
          if ! sudo chown -R "$(id -u):$(id -g)" "$STATIC_OUTPUT_DIR"; then
            result=1
          fi
          if ! sudo chmod -R u+rwX,go+rX "$STATIC_OUTPUT_DIR"; then
            result=1
          fi
          for required_evidence in \
            git-version.txt \
            actionlint-version.txt \
            fixed-commit-parent-identity.txt \
            fixed-commit-delta-whitespace.log \
            fixed-commit-delta-whitespace.exit-code \
            candidate-workflow-diff-check.txt \
            candidate-workflow-diff-check.exit-code \
            clean-checkout-diff.log \
            clean-checkout-diff.exit-code \
            baseline-diff-status.txt; do
            if [ ! -r "$STATIC_OUTPUT_DIR/$required_evidence" ]; then
              result=1
            fi
          done
          if [ ! -r "$EVIDENCE_DIR/static-checks.log" ]; then
            result=1
          fi
          if ! printf '%s\n' "$result" > "$EVIDENCE_DIR/static-checks.exit-code"; then
            result=1
          fi
          set -e
          test "$result" -eq 0

      - name: Record test scope and evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'node_test_glob=.github/workflows/scripts/*.test.mjs\n'
            printf 'node_test_partition=38 Normal Group files plus 1 Scoped Group file; manifests record the full partition\n'
            printf 'node_test_scoped_file=.github/workflows/scripts/authorize-decision-egress.test.mjs\n'
            printf 'node_test_group_order=Scoped Group first, then Normal Group within one shared 600-second Node step budget plus 10-second kill grace\n'
            printf 'node_test_preload=node-test-keepalive-preload.mjs; Scoped Group only; SHA-256 in node-test-keepalive-preload.sha256\n'
            printf 'node_test_group_exit_codes=node-tests-normal.exit-code,node-tests-scoped.exit-code,node-tests.exit-code\n'
            printf 'node_test_count_policy=record TAP tests/pass/fail/cancelled/skipped/todo per group; historical 650+17 is diagnostic, not a hard-coded pass gate\n'
            printf 'worker_test_command=npm test --prefix cloudflare-worker\n'
            printf 'actionlint_scope=.github/workflows/*.yml plus checked-out candidate workflow\n'
            printf 'fixed_commit_delta_whitespace_check=git diff --check HEAD^1 HEAD after exact Evaluation and First Parent identity/object verification\n'
            printf 'fixed_commit_parent_evidence=static-output/fixed-commit-parent-identity.txt,static-output/fixed-commit-delta-whitespace.log,static-output/fixed-commit-delta-whitespace.exit-code\n'
            printf 'historical_whitespace_reference=third CI Run 41574377041 and its existing Artifact; preserved, not substituted for the current delta check\n'
            printf 'baseline_diff_check=BASELINE_NOT_BOUND; clean checkout git diff --check result is recorded separately and does not bind the full baseline\n'
            printf 'traceability_file=.github/workflows/config/routing-traceability.json\n'
            printf 'traceability_contract=T-017; status is not mutated by this workflow\n'
            printf 'dependency_install=npm ci --ignore-scripts; lifecycle dependencies need runtime verification\n'
          } > "$EVIDENCE_DIR/scope-and-traceability.txt"
          find "$EVIDENCE_DIR" -type f -printf '%P\n' | sort \
            > "$EVIDENCE_DIR/evidence-file-list.txt"

      - name: Upload G1 offline validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-offline-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/g1-evidence/
          if-no-files-found: error
          retention-days: 30
